name: Bug report
description: Report something not working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thanks for taking the time to report a bug!"
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Tag, version, or commit hash you are running.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS:
        Node version:
        Docker / browser: