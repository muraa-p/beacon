name: Feature request
description: Suggest an idea for Beacon
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: "Thanks for suggesting an idea!"
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case from your point of view.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How do you imagine it working?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered